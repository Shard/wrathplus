# The gates of scripts/gates.sh that need neither a WoW install nor a display, on Linux, for a pull
# request: a red one is seen before anyone builds it. The data-gated tests, the engine
# boot checks and a live run happen on the maintainer's machine before it lands.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Every PR gets the same bare-runner checks, including branches in this repository.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      # No debuginfo: it is most of target/, and a runner's disk is small.
      CARGO_PROFILE_DEV_DEBUG: 0
      # Set and empty: no install, as the gates' test-no-install runs.
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: gate-contracts
        run: |
          python3 scripts/quality/test_gate.py
          python3 scripts/test_doc_links.py
      - name: loc
        run: scripts/quality/run.sh loc
      - name: ws2
        run: scripts/quality/run.sh ws2
      - name: clippy
        # The ratchet: warnings mode, every warning fails unless the committed baseline names it.
        run: AZB_QUALITY_LOCKED=1 CARGO_TARGET_DIR=target scripts/quality/run.sh clippy --workspace
      - name: test
        run: cargo test --workspace
      - name: doc-links
        run: scripts/doc-links.py
      - name: pass-span-lint
        run: scripts/pass-span-lint.py
      - name: player-tests
        run: cargo test -p wrathplus-formats -p wrathplus-app-core -p wrathplus-app-net -p wrathplus-app-world -p wrathplus-app-ui -p wrathplus-app-tools -p wrathplus-app --no-default-features --lib
