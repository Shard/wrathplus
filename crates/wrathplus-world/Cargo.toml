[package]
name = "wrathplus-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The world renderer: terrain, water, sky, weather, models, lighting, collision and the frame ladder; everything needed to put something in a world and ask the world about itself, with no game attached"

[lints]
workspace = true

[features]
# The dev/player seam, on by default. `wrathplus-assets` and `-formats` come in without default
# features and their `dev` is forwarded here, or unification would put it back in a player build.
default = ["dev"]
# `bevy/debug` names systems and parameters in ECS diagnostics (else "Enable the debug feature to
# see the name"); set here so `wrathplus-worldview`, which reports those names, gets it too.
dev = ["wrathplus-formats/dev", "wrathplus-assets/dev", "bevy/debug"]

[dependencies]
avian3d = "0.6"
wrathplus-assets = { path = "../wrathplus-assets", default-features = false }
wrathplus-formats = { path = "../wrathplus-formats", default-features = false }
# No `wrathplus-protocol`: the engine renders a world and does not speak the protocol.
# For the portal audit, which re-parses a WMO group to check its decode against the file.
wrathplus-wmo = { path = "../wrathplus-wmo" }
bevy.workspace = true
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# macOS AppKit calls, at `wrathplus-app`'s pins so the graph has one objc2.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2", features = [
    # `bgwin`'s Accessory demotion and window ordering, and `modkeys`' modifier read.
    "NSApplication",
    "NSEvent",
    # `mac_quit` walks the default menu bar to re-point the Quit item.
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
] }
# `MainThreadMarker`, for the AppKit calls above.
objc2-foundation = "0.2"
# `sel!`, for the two selectors `mac_quit` swaps; the objc2 that objc2-app-kit 0.2 builds against.
objc2 = "0.5"

[dev-dependencies]
# Match Bevy 0.18's Naga module type for CPU-only shader validation.
naga = { version = "27", features = ["wgsl-in"] }
futures-lite = "2"
# The clean-exit test's stand-in render thread, on Bevy's own channel type.
async-channel = "2"
# Synthetic MH2O layers for the Wrath liquid spawn tests.
wrathplus-adt = { path = "../wrathplus-adt" }
